imports:
    - { resource: 'tables.yml' }
    - { resource: 'services_search.yml' }

services:
    phpbbmodders.knowledgebase.controller.index:
        class: phpbbmodders\knowledgebase\controller\index
        arguments:
            - '@dbal.conn'
            - '@config'
            - '@controller.helper'
            - '@language'
            - '@auth'
            - '@template'
            - '@user'
            - '@phpbbmodders.knowledgebase.inc'
            - '%tables.articles_table%'
            - '%tables.categories_table%'

    phpbbmodders.knowledgebase.controller.category:
        class: phpbbmodders\knowledgebase\controller\category
        arguments:
            - '@dbal.conn'
            - '@config'
            - '@controller.helper'
            - '@language'
            - '@auth'
            - '@request'
            - '@template'
            - '@user'
            - '@pagination'
            - '@phpbbmodders.knowledgebase.inc'
            - '%tables.articles_table%'
            - '%tables.categories_table%'

    phpbbmodders.knowledgebase.controller.article:
        class: phpbbmodders\knowledgebase\controller\article
        arguments:
            - '@dbal.conn'
            - '@config'
            - '@controller.helper'
            - '@language'
            - '@auth'
            - '@request'
            - '@template'
            - '@user'
            - '@phpbbmodders.knowledgebase.inc'
            - '%core.root_path%'
            - '%core.php_ext%'
            - '%tables.articles_table%'
            - '%tables.kb_attachments_table%'

    phpbbmodders.knowledgebase.controller.posting:
        class: phpbbmodders\knowledgebase\controller\posting
        arguments:
            - '@dbal.conn'
            - '@config'
            - '@controller.helper'
            - '@ext.manager'
            - '@language'
            - '@auth'
            - '@request'
            - '@template'
            - '@user'
            - '@cache.driver'
            - '@log'
            - '@files.factory'
            - '@plupload'
            - '@notification_manager'
            - '@phpbbmodders.knowledgebase.inc'
            - '@phpbbmodders.knowledgebase.search.backend_factory'
            - '%core.root_path%'
            - '%core.php_ext%'
            - '%tables.logs_table%'
            - '%tables.articles_table%'
            - '%tables.categories_table%'
            - '%tables.kb_attachments_table%'

    phpbbmodders.knowledgebase.controller.approve:
        class: phpbbmodders\knowledgebase\controller\approve
        arguments:
            - '@dbal.conn'
            - '@config'
            - '@controller.helper'
            - '@language'
            - '@auth'
            - '@request'
            - '@template'
            - '@user'
            - '@cache.driver'
            - '@log'
            - '@notification_manager'
            - '@phpbbmodders.knowledgebase.inc'
            - '@phpbbmodders.knowledgebase.search.backend_factory'
            - '%core.root_path%'
            - '%core.php_ext%'
            - '%tables.articles_table%'

    phpbbmodders.knowledgebase.controller.search:
        class: phpbbmodders\knowledgebase\controller\search
        arguments:
            - '@dbal.conn'
            - '@config'
            - '@controller.helper'
            - '@language'
            - '@auth'
            - '@request'
            - '@template'
            - '@user'
            - '@pagination'
            - '@phpbbmodders.knowledgebase.inc'
            - '@phpbbmodders.knowledgebase.search.backend_factory'
            - '%core.root_path%'
            - '%core.php_ext%'
            - '%tables.articles_table%'
            - '%tables.categories_table%'

    phpbbmodders.knowledgebase.listener:
        class: phpbbmodders\knowledgebase\event\listener
        arguments:
            - '@config'
            - '@config_text'
            - '@controller.helper'
            - '@language'
            - '@auth'
            - '@template'
            - '%core.php_ext%'
        tags:
            - { name: event.listener }

    phpbbmodders.knowledgebase.inc:
        class: phpbbmodders\knowledgebase\inc\functions_kb
        arguments:
            - '@dbal.conn'
            - '@config'
            - '@config_text'
            - '@controller.helper'
            - '@ext.manager'
            - '@language'
            - '@auth'
            - '@template'
            - '@user'
            - '@cache.driver'
            - '@log'
            - '%core.root_path%'
            - '%core.php_ext%'
            - '%tables.articles_table%'
            - '%tables.categories_table%'
            - '%tables.logs_table%'
            - '%tables.kb_attachments_table%'
            - '%tables.kb_options_table%'
            - '%tables.kb_users_table%'
            - '%tables.kb_groups_table%'
            - '%tables.kb_revisions_table%'
            - '@group_helper'

    phpbbmodders.knowledgebase.controller.kb_file:
        class: phpbbmodders\knowledgebase\controller\kb_file
        arguments:
            - '@dbal.conn'
            - '@language'
            - '@request'
            - '@ext.manager'
            - '@auth'
            - '@user'
            - '@phpbbmodders.knowledgebase.inc'
            - '%tables.kb_attachments_table%'
            - '%tables.articles_table%'

    phpbbmodders.knowledgebase.controller.acp:
        class: phpbbmodders\knowledgebase\controller\acp_controller
        arguments:
            - '@dbal.conn'
            - '@config'
            - '@config_text'
            - '@controller.helper'
            - '@ext.manager'
            - '@language'
            - '@auth'
            - '@request'
            - '@template'
            - '@user'
            - '@cache.driver'
            - '@group_helper'
            - '@pagination'
            - '@log'
            - '@phpbbmodders.knowledgebase.inc'
            - '@phpbbmodders.knowledgebase.search.backend_collection'
            - '@phpbbmodders.knowledgebase.search.backend_factory'
            - '%core.root_path%'
            - '%core.php_ext%'
            - '%tables.articles_table%'
            - '%tables.categories_table%'
            - '%tables.logs_table%'
            - '%tables.kb_attachments_table%'
            - '%tables.kb_options_table%'
            - '%tables.kb_users_table%'
            - '%tables.kb_groups_table%'

    phpbbmodders.knowledgebase.controller.set_order:
        class: phpbbmodders\knowledgebase\controller\set_order
        arguments:
            - '@dbal.conn'
            - '@config'
            - '@request'
            - '%tables.articles_table%'

    phpbbmodders.knowledgebase.notification.type.need_approval:
        class: phpbbmodders\knowledgebase\notification\type\need_approval
        shared: false # service MUST not be shared for this to work!
        parent: notification.type.base
        calls:
            - [ 'set_controller_helper', [ '@controller.helper' ] ]
            - [ 'set_user_loader', [ '@user_loader' ] ]
            - [ 'set_group_helper', [ '@group_helper' ] ]
            - [ 'set_tables', [ '%tables.kb_options_table%', '%tables.kb_users_table%', '%tables.kb_groups_table%' ] ]
        tags:
            - { name: notification.type }

    phpbbmodders.knowledgebase.notification.type.approve:
        class: phpbbmodders\knowledgebase\notification\type\approve
        shared: false # service MUST not be shared for this to work!
        parent: notification.type.base
        calls:
            - [ 'set_controller_helper', [ '@controller.helper' ] ]
            - [ 'set_user_loader', [ '@user_loader' ] ]
            - [ 'set_group_helper', [ '@group_helper' ] ]
            - [ 'set_tables', [ '%tables.kb_options_table%', '%tables.kb_users_table%', '%tables.kb_groups_table%' ] ]
        tags:
            - { name: notification.type }

    phpbbmodders.knowledgebase.notification.type.disapprove:
        class: phpbbmodders\knowledgebase\notification\type\disapprove
        shared: false # service MUST not be shared for this to work!
        parent: notification.type.base
        calls:
            - [ 'set_controller_helper', [ '@controller.helper' ] ]
            - [ 'set_user_loader', [ '@user_loader' ] ]
            - [ 'set_group_helper', [ '@group_helper' ] ]
            - [ 'set_tables', [ '%tables.kb_options_table%', '%tables.kb_users_table%', '%tables.kb_groups_table%' ] ]
        tags:
            - { name: notification.type }
