imports:
    - { resource: 'tables.yml' }
    - { resource: 'services_search.yml' }

services:
    phpbbmodders.knowledgebase.controller.index:
        class: phpbbmodders\knowledgebase\controller\index
        arguments:
            - '@dbal.conn'
            - '@config'
            - '@controller.helper'
            - '@language'
            - '@auth'
            - '@request'
            - '@template'
            - '@user'
            - '@pagination'
            - '@phpbbmodders.knowledgebase.inc'
            - '%tables.articles_table%'
            - '%tables.categories_table%'

    phpbbmodders.knowledgebase.controller.category:
        class: phpbbmodders\knowledgebase\controller\category
        arguments:
            - '@dbal.conn'
            - '@config'
            - '@controller.helper'
            - '@language'
            - '@auth'
            - '@request'
            - '@template'
            - '@user'
            - '@pagination'
            - '@phpbbmodders.knowledgebase.inc'
            - '%tables.articles_table%'
            - '%tables.categories_table%'

    phpbbmodders.knowledgebase.controller.article:
        class: phpbbmodders\knowledgebase\controller\article
        arguments:
            - '@dbal.conn'
            - '@config'
            - '@controller.helper'
            - '@language'
            - '@auth'
            - '@request'
            - '@template'
            - '@user'
            - '@phpbbmodders.knowledgebase.inc'
            - '@phpbbmodders.knowledgebase.article_text'
            - '@phpbbmodders.knowledgebase.field.factory'
            - '%core.root_path%'
            - '%core.php_ext%'
            - '%tables.articles_table%'
            - '%tables.kb_attachments_table%'

    phpbbmodders.knowledgebase.controller.posting:
        class: phpbbmodders\knowledgebase\controller\posting
        arguments:
            - '@dbal.conn'
            - '@config'
            - '@controller.helper'
            - '@ext.manager'
            - '@language'
            - '@auth'
            - '@request'
            - '@template'
            - '@user'
            - '@cache.driver'
            - '@log'
            - '@files.factory'
            - '@plupload'
            - '@notification_manager'
            - '@phpbbmodders.knowledgebase.inc'
            - '@phpbbmodders.knowledgebase.article_text'
            - '@phpbbmodders.knowledgebase.search.backend_factory'
            - '@phpbbmodders.knowledgebase.field.factory'
            - '%core.root_path%'
            - '%core.php_ext%'
            - '%tables.logs_table%'
            - '%tables.articles_table%'
            - '%tables.categories_table%'
            - '%tables.kb_attachments_table%'

    phpbbmodders.knowledgebase.controller.approve:
        class: phpbbmodders\knowledgebase\controller\approve
        arguments:
            - '@dbal.conn'
            - '@config'
            - '@controller.helper'
            - '@language'
            - '@auth'
            - '@request'
            - '@template'
            - '@user'
            - '@cache.driver'
            - '@log'
            - '@notification_manager'
            - '@pagination'
            - '@phpbbmodders.knowledgebase.inc'
            - '@phpbbmodders.knowledgebase.article_text'
            - '@phpbbmodders.knowledgebase.search.backend_factory'
            - '%core.root_path%'
            - '%core.php_ext%'
            - '%tables.articles_table%'

    phpbbmodders.knowledgebase.controller.search:
        class: phpbbmodders\knowledgebase\controller\search
        arguments:
            - '@dbal.conn'
            - '@config'
            - '@controller.helper'
            - '@language'
            - '@auth'
            - '@request'
            - '@template'
            - '@user'
            - '@pagination'
            - '@phpbbmodders.knowledgebase.inc'
            - '@phpbbmodders.knowledgebase.article_text'
            - '@phpbbmodders.knowledgebase.search.backend_factory'
            - '%core.root_path%'
            - '%core.php_ext%'
            - '%tables.articles_table%'
            - '%tables.categories_table%'

    phpbbmodders.knowledgebase.listener:
        class: phpbbmodders\knowledgebase\event\listener
        arguments:
            - '@config'
            - '@config_text'
            - '@controller.helper'
            - '@language'
            - '@auth'
            - '@template'
            - '%core.php_ext%'
        tags:
            - { name: event.listener }

    phpbbmodders.knowledgebase.text_formatter.factory:
        class: phpbbmodders\knowledgebase\textformatter\factory
        arguments:
            - '@text_formatter.data_access'
            - '@cache.driver'
            - '@dispatcher'
            - '@config'
            - '@text_formatter.s9e.link_helper'
            - '@log'
            - '%text_formatter.cache.dir%'
            - '_phpbbmodders_knowledgebase_text_formatter_parser_v2'
            - '_phpbbmodders_knowledgebase_text_formatter_renderer_v2'

    phpbbmodders.knowledgebase.text_formatter.parser:
        class: phpbb\textformatter\s9e\parser
        arguments:
            - '@cache.driver'
            - '_phpbbmodders_knowledgebase_text_formatter_parser_v2'
            - '@phpbbmodders.knowledgebase.text_formatter.factory'
            - '@dispatcher'

    phpbbmodders.knowledgebase.text_formatter.renderer:
        class: phpbb\textformatter\s9e\renderer
        arguments:
            - '@cache.driver'
            - '%text_formatter.cache.dir%'
            - '_phpbbmodders_knowledgebase_text_formatter_renderer_v2'
            - '@phpbbmodders.knowledgebase.text_formatter.factory'
            - '@dispatcher'
        calls:
            - [configure_quote_helper, ['@text_formatter.s9e.quote_helper']]
            - [configure_smilies_path, ['@config', '@path_helper']]
            - [configure_user, ['@user', '@config', '@auth']]

    phpbbmodders.knowledgebase.article_text:
        class: phpbbmodders\knowledgebase\textformatter\article_text
        arguments:
            - '@service_container'
            - '@config'
            - '@text_formatter.utils'

    phpbbmodders.knowledgebase.inc:
        class: phpbbmodders\knowledgebase\inc\functions_kb
        arguments:
            - '@dbal.conn'
            - '@config'
            - '@config_text'
            - '@controller.helper'
            - '@ext.manager'
            - '@language'
            - '@auth'
            - '@template'
            - '@user'
            - '@cache.driver'
            - '@log'
            - '%core.root_path%'
            - '%core.php_ext%'
            - '%tables.articles_table%'
            - '%tables.categories_table%'
            - '%tables.logs_table%'
            - '%tables.kb_attachments_table%'
            - '%tables.kb_options_table%'
            - '%tables.kb_users_table%'
            - '%tables.kb_groups_table%'
            - '%tables.kb_revisions_table%'
            - '%tables.kb_article_categories_table%'
            - '%tables.kb_fields_table%'
            - '%tables.kb_field_values_table%'
            - '%tables.kb_article_field_values_table%'
            - '%tables.kb_article_co_authors_table%'
            - '%tables.kb_draft_edits_table%'
            - '@group_helper'

    phpbbmodders.knowledgebase.controller.kb_file:
        class: phpbbmodders\knowledgebase\controller\kb_file
        arguments:
            - '@dbal.conn'
            - '@language'
            - '@request'
            - '@ext.manager'
            - '@auth'
            - '@user'
            - '@phpbbmodders.knowledgebase.inc'
            - '%tables.kb_attachments_table%'
            - '%tables.articles_table%'

    phpbbmodders.knowledgebase.controller.acp:
        class: phpbbmodders\knowledgebase\controller\acp_controller
        arguments:
            - '@dbal.conn'
            - '@config'
            - '@config_text'
            - '@controller.helper'
            - '@ext.manager'
            - '@language'
            - '@auth'
            - '@request'
            - '@template'
            - '@user'
            - '@cache.driver'
            - '@group_helper'
            - '@pagination'
            - '@log'
            - '@phpbbmodders.knowledgebase.inc'
            - '@phpbbmodders.knowledgebase.search.backend_collection'
            - '@phpbbmodders.knowledgebase.search.backend_factory'
            - '@phpbbmodders.knowledgebase.field.factory'
            - '%core.root_path%'
            - '%core.php_ext%'
            - '%tables.articles_table%'
            - '%tables.categories_table%'
            - '%tables.logs_table%'
            - '%tables.kb_attachments_table%'
            - '%tables.kb_options_table%'
            - '%tables.kb_users_table%'
            - '%tables.kb_groups_table%'

    phpbbmodders.knowledgebase.controller.set_order:
        class: phpbbmodders\knowledgebase\controller\set_order
        arguments:
            - '@dbal.conn'
            - '@config'
            - '@controller.helper'
            - '@request'
            - '@user'
            - '@phpbbmodders.knowledgebase.inc'
            - '%tables.articles_table%'

    phpbbmodders.knowledgebase.notification.type.need_approval:
        class: phpbbmodders\knowledgebase\notification\type\need_approval
        shared: false # service MUST not be shared for this to work!
        parent: notification.type.base
        calls:
            - [ 'set_controller_helper', [ '@controller.helper' ] ]
            - [ 'set_user_loader', [ '@user_loader' ] ]
            - [ 'set_group_helper', [ '@group_helper' ] ]
            - [ 'set_tables', [ '%tables.kb_options_table%', '%tables.kb_users_table%', '%tables.kb_groups_table%' ] ]
        tags:
            - { name: notification.type }

    phpbbmodders.knowledgebase.notification.type.approve:
        class: phpbbmodders\knowledgebase\notification\type\approve
        shared: false # service MUST not be shared for this to work!
        parent: notification.type.base
        calls:
            - [ 'set_controller_helper', [ '@controller.helper' ] ]
            - [ 'set_user_loader', [ '@user_loader' ] ]
            - [ 'set_group_helper', [ '@group_helper' ] ]
            - [ 'set_tables', [ '%tables.kb_options_table%', '%tables.kb_users_table%', '%tables.kb_groups_table%' ] ]
            - [ 'set_config', [ '@config' ] ]
        tags:
            - { name: notification.type }

    phpbbmodders.knowledgebase.notification.type.disapprove:
        class: phpbbmodders\knowledgebase\notification\type\disapprove
        shared: false # service MUST not be shared for this to work!
        parent: notification.type.base
        calls:
            - [ 'set_controller_helper', [ '@controller.helper' ] ]
            - [ 'set_user_loader', [ '@user_loader' ] ]
            - [ 'set_group_helper', [ '@group_helper' ] ]
            - [ 'set_tables', [ '%tables.kb_options_table%', '%tables.kb_users_table%', '%tables.kb_groups_table%' ] ]
            - [ 'set_config', [ '@config' ] ]
        tags:
            - { name: notification.type }

    phpbbmodders.knowledgebase.notification.method.pm:
        class: phpbbmodders\knowledgebase\notification\method\pm
        shared: false # service MUST not be shared for this to work!
        arguments:
            - '@user'
            - '%core.root_path%'
            - '%core.php_ext%'
        tags:
            - { name: notification.method }

    # Custom fields
    phpbbmodders.knowledgebase.field.multi_select:
        class: phpbbmodders\knowledgebase\inc\field\kb_multi_select_field_type
        arguments:
            - '@language'
        tags:
            - { name: phpbbmodders.knowledgebase.field_type }

    phpbbmodders.knowledgebase.field.single_select:
        class: phpbbmodders\knowledgebase\inc\field\kb_single_select_field_type
        arguments:
            - '@language'
        tags:
            - { name: phpbbmodders.knowledgebase.field_type }

    phpbbmodders.knowledgebase.field.radio_select:
        class: phpbbmodders\knowledgebase\inc\field\kb_radio_select_field_type
        arguments:
            - '@language'
        tags:
            - { name: phpbbmodders.knowledgebase.field_type }

    phpbbmodders.knowledgebase.field.factory:
        class: phpbbmodders\knowledgebase\inc\field\kb_field_type_factory
        arguments:
            - '@phpbbmodders.knowledgebase.field.collection'

    phpbbmodders.knowledgebase.field.collection:
        class: phpbb\di\service_collection
        arguments:
            - '@service_container'
        tags:
            - { name: service_collection, tag: phpbbmodders.knowledgebase.field_type, class_name_aware: true }
