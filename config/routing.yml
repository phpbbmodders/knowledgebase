phpbbmodders_knowledgebase_index:
    path: /knowledgebase
    defaults: { _controller: phpbbmodders.knowledgebase.controller.index:main }

phpbbmodders_knowledgebase_kb_alias:
    path: /kb
    defaults: { _controller: phpbbmodders.knowledgebase.controller.index:kb_alias }

# Mirrors every /knowledgebase/{segment} route below at /kb/{segment}
# too, without needing a matching entry added here each time a new one
# is - every real route takes its actual parameters via the query
# string, not the path itself, so a single catch-all on the path's
# second segment plus a verbatim query-string passthrough covers all
# of them.
phpbbmodders_knowledgebase_kb_alias_path:
    path: /kb/{segment}
    defaults: { _controller: phpbbmodders.knowledgebase.controller.index:kb_alias_path }
    requirements:
        segment: '[a-z_]+'

phpbbmodders_knowledgebase_category:
    path: /knowledgebase/category
    defaults: { _controller: phpbbmodders.knowledgebase.controller.category:cat }

phpbbmodders_knowledgebase_my_articles:
    path: /knowledgebase/my_articles
    defaults: { _controller: phpbbmodders.knowledgebase.controller.index:my_articles }

phpbbmodders_knowledgebase_recent_changes:
    path: /knowledgebase/recent_changes
    defaults: { _controller: phpbbmodders.knowledgebase.controller.recent_changes:page }

# The feeds of the recent changes page. Under /knowledgebase/ only: the /kb/
# alias above forwards to routes without a file extension.
phpbbmodders_knowledgebase_recent_changes_feed:
    path: /knowledgebase/recent_changes.{_format}
    defaults: { _controller: phpbbmodders.knowledgebase.controller.recent_changes:feed }
    requirements:
        _format: rss|atom

phpbbmodders_knowledgebase_article:
    path: /knowledgebase/article
    defaults: { _controller: phpbbmodders.knowledgebase.controller.article:show }

phpbbmodders_knowledgebase_change_author:
    path: /knowledgebase/change_author
    defaults: { _controller: phpbbmodders.knowledgebase.controller.change_author:main }

phpbbmodders_knowledgebase_posting:
    path: /knowledgebase/posting
    defaults: { _controller: phpbbmodders.knowledgebase.controller.posting:post_article }

# A custom alternative stylesheet from the board's store folder, picked in the
# ACP; the file name travels in the "f" query parameter like every other
# route here.
phpbbmodders_knowledgebase_stylesheet:
    path: /knowledgebase/stylesheet
    defaults: { _controller: phpbbmodders.knowledgebase.controller.stylesheet:serve }

phpbbmodders_knowledgebase_search:
    path: /knowledgebase/search
    defaults: { _controller: phpbbmodders.knowledgebase.controller.search:main }

phpbbmodders_knowledgebase_approve:
    path: /knowledgebase/approve
    defaults: { _controller: phpbbmodders.knowledgebase.controller.approve:approve_article }

phpbbmodders_knowledgebase_queue:
    path: /knowledgebase/queue
    defaults: { _controller: phpbbmodders.knowledgebase.controller.approve:queue }

phpbbmodders_knowledgebase_kb_file:
    path: /knowledgebase/kb_file
    defaults: { _controller: phpbbmodders.knowledgebase.controller.kb_file:main }

phpbbmodders_knowledgebase_set_order:
    path: /knowledgebase/set_order
    defaults: { _controller: phpbbmodders.knowledgebase.controller.set_order:main }
