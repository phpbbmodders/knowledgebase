services:

    # Search backends
    phpbbmodders.knowledgebase.search.fulltext.mysql:
        class: phpbbmodders\knowledgebase\search\backend\kb_fulltext_mysql
        arguments:
            - '@config'
            - '@dbal.conn'
            - '@language'
            - '@user'
            - '%tables.articles_table%'
            - '%tables.search_result_table%'
            - '%core.root_path%'
            - '%core.php_ext%'
        tags:
            - { name: phpbbmodders.knowledgebase.search.backend }

    phpbbmodders.knowledgebase.search.fulltext.native:
        class: phpbbmodders\knowledgebase\search\backend\kb_fulltext_native
        arguments:
            - '@config'
            - '@dbal.conn'
            - '@language'
            - '@user'
            - '%tables.articles_table%'
            - '%tables.search_result_table%'
            - '%tables.wordmatch_table%'
            - '%tables.wordlist_table%'
            - '%core.root_path%'
            - '%core.php_ext%'
        tags:
            - { name: phpbbmodders.knowledgebase.search.backend }

    phpbbmodders.knowledgebase.search.fulltext.postgres:
        class: phpbbmodders\knowledgebase\search\backend\kb_fulltext_postgres
        arguments:
            - '@config'
            - '@dbal.conn'
            - '@language'
            - '@user'
            - '%tables.articles_table%'
            - '%tables.search_result_table%'
            - '%core.root_path%'
            - '%core.php_ext%'
        tags:
            - { name: phpbbmodders.knowledgebase.search.backend }

    # Factory
    phpbbmodders.knowledgebase.search.backend_factory:
        class: phpbbmodders\knowledgebase\search\kb_search_backend_factory
        arguments:
            - '@config'
            - '@phpbbmodders.knowledgebase.search.backend_collection'

    # Collections
    phpbbmodders.knowledgebase.search.backend_collection:
        class: phpbb\di\service_collection
        arguments:
            - '@service_container'
        tags:
            - { name: service_collection, tag: phpbbmodders.knowledgebase.search.backend, class_name_aware: true }
