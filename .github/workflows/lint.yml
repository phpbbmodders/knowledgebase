name: Lint

# PHP syntax check on the lowest PHP version this extension supports and the
# newest one. tests.yml runs phpBB's own checks (code sniffer, EPV) and
# the PHPUnit suite.
on:
  push:
    branches:
      - main
  pull_request:
    branches:
      - main

permissions:
  contents: read

jobs:
  lint:
    name: PHP ${{ matrix.php }} lint
    runs-on: ubuntu-24.04
    strategy:
      matrix:
        php: ['8.1', '8.5']
    steps:
      - uses: actions/checkout@v4

      - name: Set up PHP ${{ matrix.php }}
        uses: shivammathur/setup-php@v2
        with:
          php-version: ${{ matrix.php }}
          coverage: none
          tools: composer:v2

      - name: PHP syntax check
        run: find . -name '*.php' -not -path './.git/*' -not -path './vendor/*' -print0 | xargs -0 -n1 php -l

      - name: Validate composer.json
        run: composer validate --no-check-all --no-check-publish
